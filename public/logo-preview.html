<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logo Preview</title>
  <style>
    body {
      background: #0d0d11;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      padding: 40px;
    }
    .preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: flex-start;
      margin-top: 30px;
      justify-content: center;
    }
    .card {
      background: #16161e;
      border: 1px solid #262635;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      width: 280px;
    }
    .card img {
      width: 250px;
      height: 250px;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
    }
    svg {
      background: #000;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <h1>NGP Logo Path Optimization</h1>
  <div class="preview-container">
    <div class="card">
      <h3>Reference Image</h3>
      <img src="client-logo.png" alt="Client Logo Reference" />
    </div>

    <div class="card">
      <h3>Draft 7: Perfect Sliced NG Monogram</h3>
      <svg width="250" height="250" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="skewX(-14) translate(12, 0)">
          <!-- N Path -->
          <path d="M 8 10 H 22 L 38 74 V 10 L 52 80 V 90 H 38 L 22 26 V 90 H 8 Z" fill="#f97316" />
          <!-- G Path (Corrected to be a real G) -->
          <path d="M 56 10 H 92 V 90 H 60 L 57.2 76 V 62 H 78 V 48 H 66 V 24 H 56 Z" fill="#ffffff" />
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
